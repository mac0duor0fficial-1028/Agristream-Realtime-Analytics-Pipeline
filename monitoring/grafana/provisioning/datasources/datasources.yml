apiVersion: 1
datasources:
  - name: AgriStream Postgres
    uid: agristream-pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${GRAFANA_DB_USER}
    isDefault: true
    jsonData:
      database: ${PG_DB}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
