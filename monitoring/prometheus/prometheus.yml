global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]
  - job_name: flink-taskmanager
    dns_sd_configs:                 # discovers every replica when scaled
      - names: ["taskmanager"]
        type: A
        port: 9249
